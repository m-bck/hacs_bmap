set_category:
  target:
    entity:
      integration: buymeapie
      domain: todo
  fields:
    item:
      required: true
      example: Hafermilch
      selector:
        text:
    category:
      required: true
      example: Kühlregal
      selector:
        text:

suggest_category:
  target:
    entity:
      integration: buymeapie
      domain: todo
  fields:
    item:
      required: true
      example: Hafermilch
      selector:
        text:

add_recipe:
  fields:
    recipe:
      required: true
      example: Lasagne
      selector:
        text:
    portions:
      example: 6
      selector:
        number:
          min: 1
          max: 100
          mode: box
    without:
      example: "Tomaten, Parmesan"
      selector:
        text:
          multiple: true
    todo_list:
      selector:
        entity:
          integration: buymeapie
          domain: todo

get_recipe:
  fields:
    recipe:
      example: Lasagne
      selector:
        text:
    portions:
      selector:
        number:
          min: 1
          max: 100
          mode: box
